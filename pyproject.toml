[project]
name = "aeroquant-lab"
version = "0.3.0"
description = "Plataforma de pesquisa para monitoramento inteligente da saúde de aeronaves — Digital Twin, RUL, manutenção preditiva."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eduardo" }]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]
dashboard = [
    "streamlit>=1.35",
]
mlops = [
    "mlflow>=2.10",
    "dvc>=3.0",
    "great-expectations>=0.18",
]
ml = [
    "torch>=2.2",
    "shap>=0.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
