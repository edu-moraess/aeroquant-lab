name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Testes unitários
        run: |
          PYTHONPATH=src python -m unittest discover tests/unit -v

      - name: Testes de integração
        run: |
          PYTHONPATH=src python -m unittest discover tests/integration -v

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/ || true # não-bloqueante até o backlog de lint ser resolvido

  # Job separado e não-bloqueante para os módulos não testados no ambiente
  # de desenvolvimento original (api/, dashboards/) — ver CONTRIBUTING.md.
  # Remover `continue-on-error` assim que estiverem validados.
  untested-extras:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar extras
        run: pip install -r requirements/api.txt -r requirements/dashboard.txt
      - name: Import smoke test
        run: |
          PYTHONPATH=src python -c "import aeroquant.api.main"
