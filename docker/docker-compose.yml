# Orquestração local MVP. Serviços `api` e `dashboard` referenciam código
# que existe em src/aeroquant/api/ e dashboards/, mas NÃO foi testado neste
# ambiente (sem fastapi/streamlit instalados aqui — ver CONTRIBUTING.md).
# Descomente conforme for validando cada um.
version: "3.9"

services:
  core-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      sh -c "python -m unittest discover tests/unit -v &&
             python -m unittest discover tests/integration -v"

